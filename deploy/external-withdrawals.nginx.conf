# Add this exact read-only location inside the existing btc-data HTTPS server.
location = /public/execution/external-withdrawals.json {
    alias /var/www/btc-public-execution/external-withdrawals.json;
    default_type application/json;
    etag on;
    add_header Access-Control-Allow-Origin $observatory_cors_origin always;
    add_header Vary "Origin" always;
    add_header Cache-Control "public, max-age=15, stale-while-revalidate=30" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    limit_except GET {
        deny all;
    }
}
